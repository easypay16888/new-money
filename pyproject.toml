[project]
name = "okx-autonomous-quant"
version = "0.1.0"
description = "Fail-closed OKX demo trading infrastructure"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1",
  "websockets>=13,<16", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1", "redis>=5,<7", "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1", "prometheus-client>=0.21,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "respx>=0.21,<1", "ruff>=0.8,<1", "black>=24,<27", "mypy>=1.13,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.black]
line-length = 100
target-version = ["py312"]
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
