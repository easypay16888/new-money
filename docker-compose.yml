services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant
      REDIS_URL: redis://redis:6379/0
      MODE: ${MODE:-PAPER}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  watchdog:
    build: .
    command: [".venv/bin/python", "-m", "app.watchdog"]
    environment:
      WATCHDOG_ENABLED: ${WATCHDOG_ENABLED:-true}
      WATCHDOG_STATUS_URL: ${WATCHDOG_STATUS_URL:-http://app:8000/status}
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-60}
      WATCHDOG_FAILURE_THRESHOLD: ${WATCHDOG_FAILURE_THRESHOLD:-3}
      WATCHDOG_RECOVERY_THRESHOLD: ${WATCHDOG_RECOVERY_THRESHOLD:-2}
      WATCHDOG_STARTUP_GRACE_SECONDS: ${WATCHDOG_STARTUP_GRACE_SECONDS:-120}
      WATCHDOG_UNHEALTHY_ALERT_SECONDS: ${WATCHDOG_UNHEALTHY_ALERT_SECONDS:-60}
      WATCHDOG_BARK_GROUP: ${WATCHDOG_BARK_GROUP:-OKX Quant Watchdog}
      BARK_SERVER: ${BARK_SERVER:-https://api.day.app}
      BARK_DEVICE_KEY: ${BARK_DEVICE_KEY:-}
      BARK_GROUP: ${BARK_GROUP:-OKX Quant}
      BARK_TIMEOUT_SECONDS: ${BARK_TIMEOUT_SECONDS:-5}
      BARK_CRITICAL_SOUND: ${BARK_CRITICAL_SOUND:-alarm}
      BARK_CRITICAL_VOLUME: ${BARK_CRITICAL_VOLUME:-5}
      BARK_INCIDENT_RETRY_INITIAL_SECONDS: ${BARK_INCIDENT_RETRY_INITIAL_SECONDS:-30}
      BARK_INCIDENT_RETRY_MAX_SECONDS: ${BARK_INCIDENT_RETRY_MAX_SECONDS:-300}
    depends_on:
      - app
    stop_signal: SIGINT
    stop_grace_period: 10s
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quant
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  prometheus:
    image: prom/prometheus:v3.13.1
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app
  grafana:
    image: grafana/grafana:12.4.11
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      - prometheus
volumes:
  postgres_data:
