name: new-money-demo

services:
  app:
    build: .
    image: new-money-demo:${DEPLOY_REVISION:-local}
    env_file: .env
    environment:
      MODE: PAPER
      LIVE_TRADING_ENABLED: "false"
      DATABASE_URL: sqlite+aiosqlite:////workspace/data/demo-trading-usdt.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/workspace/data
    ports:
      - "127.0.0.1:${DEMO_APP_PORT:-18000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - "import json, urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); raise SystemExit(not (d['running'] and d['database']))"
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3
    stop_grace_period: 120s
    restart: unless-stopped
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  watchdog:
    image: new-money-demo:${DEPLOY_REVISION:-local}
    command: [".venv/bin/python", "-m", "app.watchdog"]
    environment:
      WATCHDOG_ENABLED: "true"
      WATCHDOG_STATUS_URL: http://app:8000/status
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-60}
      WATCHDOG_FAILURE_THRESHOLD: ${WATCHDOG_FAILURE_THRESHOLD:-3}
      WATCHDOG_RECOVERY_THRESHOLD: ${WATCHDOG_RECOVERY_THRESHOLD:-2}
      WATCHDOG_STARTUP_GRACE_SECONDS: ${WATCHDOG_STARTUP_GRACE_SECONDS:-120}
      WATCHDOG_UNHEALTHY_ALERT_SECONDS: ${WATCHDOG_UNHEALTHY_ALERT_SECONDS:-60}
      WATCHDOG_BARK_GROUP: ${WATCHDOG_BARK_GROUP:-OKX Quant Watchdog}
      BARK_SERVER: ${BARK_SERVER:-https://api.day.app}
      BARK_DEVICE_KEY: ${BARK_DEVICE_KEY:-}
      BARK_GROUP: ${BARK_GROUP:-OKX Quant}
      BARK_TIMEOUT_SECONDS: ${BARK_TIMEOUT_SECONDS:-5}
      BARK_SOUND: ${BARK_SOUND:-}
      BARK_CRITICAL_SOUND: ${BARK_CRITICAL_SOUND:-alarm}
      BARK_CRITICAL_VOLUME: ${BARK_CRITICAL_VOLUME:-5}
      BARK_INCIDENT_RETRY_INITIAL_SECONDS: ${BARK_INCIDENT_RETRY_INITIAL_SECONDS:-30}
      BARK_INCIDENT_RETRY_MAX_SECONDS: ${BARK_INCIDENT_RETRY_MAX_SECONDS:-300}
    depends_on:
      app:
        condition: service_started
    stop_grace_period: 10s
    restart: unless-stopped
    logging: *bounded_logs

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *bounded_logs

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${DEMO_PROMETHEUS_PORT:-18090}:9090"
    restart: unless-stopped
    logging: *bounded_logs

  grafana:
    image: grafana/grafana:12.4.11
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${DEMO_GRAFANA_PORT:-13300}:3000"
    restart: unless-stopped
    logging: *bounded_logs

volumes:
  prometheus_data:
  grafana_data:
