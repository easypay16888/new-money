name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quant_live_acceptance_test
          POSTGRES_USER: quant_test
          POSTGRES_PASSWORD: isolated-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant_test -d quant_live_acceptance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://quant_test:isolated-ci-test-only@127.0.0.1:5432/quant_live_acceptance_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run ruff check app tests
      - run: uv run mypy app
